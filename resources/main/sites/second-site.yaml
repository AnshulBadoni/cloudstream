id: movieland
name: MovieLand
baseUrl: https://movieland.example.org
version: 1
headers:
  User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"

search:
  urlTemplate: "/find?keyword={query}&p={page}"
  method: GET
  itemSelector: ".results-grid .item-block"
  fields:
    id:
      selector: "a.link-wrapper"
      attribute: "data-id"
    title:
      selector: ".film-title"
      extraction: text
    url:
      selector: "a.link-wrapper"
      attribute: "href"
    posterUrl:
      selector: ".thumbnail img"
      attribute: "data-src"
    type:
      selector: ".film-type"
      extraction: text
      transforms:
        - map:
            "Show": "TV_SERIES"
            "Feature": "MOVIE"
      default: "MOVIE"
    releaseYear:
      selector: ".year-tag"
      type: int
    rating:
      selector: ".score-badge"
      type: double

catalogs:
  - id: popular
    name: Popular Films
    type: MOVIES
    urlTemplate: "/popular-movies?p={page}"
    itemSelector: ".results-grid .item-block"
  - id: top-rated
    name: Top Rated
    type: MOVIES
    urlTemplate: "/top-rated?p={page}"
    itemSelector: ".results-grid .item-block"
  - id: korean
    name: Korean Cinema
    type: MOVIES
    urlTemplate: "/korean-collection?p={page}"
    itemSelector: ".results-grid .item-block"

details:
  common:
    title:
      selector: "h2.main-heading"
      extraction: text
    posterUrl:
      selector: ".cover-art img"
      attribute: "src"
    backdropUrl:
      selector: ".hero-banner img"
      attribute: "src"
    description:
      selector: ".storyline-text"
      extraction: text
    releaseYear:
      selector: ".year-label"
      type: int
    rating:
      selector: ".imdb-rating"
      type: double
    genres:
      selector: ".category-chips a"
      extraction: text_list

  movie:
    duration:
      selector: ".runtime-label"
      transforms:
        - regex: "(\\d+)"
          group: 1
      type: int
