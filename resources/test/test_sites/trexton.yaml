id: trexton
name: Trexton
baseUrl: https://trexton.com
version: 1
headers:
  User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0"

search:
  urlTemplate: "/search?q={query}&page={page}"
  method: GET
  itemSelector: ".search-results .movie-card"
  fields:
    id:
      selector: "a.poster-link"
      attribute: "href"
      transforms:
        - regex: "/(movie|tv)/([a-z0-9-]+)"
          group: 2
    title:
      selector: "h3.title"
      extraction: text
      transforms:
        - trim: true
    url:
      selector: "a.poster-link"
      attribute: "href"
    posterUrl:
      selector: "img.poster"
      attribute: "src"
      fallbacks:
        - selector: "img.poster"
          attribute: "data-src"
    type:
      selector: ".badge-type"
      extraction: text
      fallbacks:
        - default: "MOVIE"
    releaseYear:
      selector: ".release-year"
      extraction: text
      transforms:
        - regex: "(\\d{4})"
          group: 1
      type: int
    rating:
      selector: ".rating"
      extraction: text
      transforms:
        - regex: "(\\d+\\.\\d+|\\d+)"
          group: 1
      type: double

catalogs:
  # 1. Latest Movies
  - id: latest
    name: Latest Movies
    type: MOVIES
    urlTemplate: "/latest?page={page}"
    itemSelector: ".movies-grid .movie-card"
    pagination:
      type: query
      param: page
      nextSelector: "a.next-page"
    fields:
      id:
        selector: "a"
        attribute: "href"
      title:
        selector: "h3.title"
        extraction: text
      url:
        selector: "a"
        attribute: "href"
      posterUrl:
        selector: "img.poster"
        attribute: "src"
      releaseYear:
        selector: ".release-year"
        extraction: text
        transforms:
          - regex: "(\\d{4})"
            group: 1
        type: int
      rating:
        selector: ".rating"
        extraction: text
        transforms:
          - regex: "(\\d+\\.\\d+|\\d+)"
            group: 1
        type: double

  # 2. Actors Panel (Explicitly 2nd position)
  - id: actors
    name: Actors & Performers
    type: PEOPLE
    urlTemplate: "/actors?page={page}"
    itemSelector: ".actors-grid .actor-card"
    fields:
      id:
        selector: "a"
        attribute: "href"
      name:
        selector: "h3.actor-name"
        extraction: text
        transforms:
          - trim: true
      url:
        selector: "a"
        attribute: "href"
      photoUrl:
        selector: "img"
        attribute: "src"

  # 3. Trending
  - id: trending
    name: Trending Movies
    type: MOVIES
    urlTemplate: "/trending?page={page}"
    itemSelector: ".movies-grid .movie-card"

  # 4. Popular
  - id: popular
    name: Popular Movies
    type: MOVIES
    urlTemplate: "/popular?page={page}"
    itemSelector: ".movies-grid .movie-card"

details:
  typeDetector:
    selector: ".seasons-container"
    existsAs: TV_SERIES
    default: MOVIE

  common:
    id:
      selector: "meta[property='og:url']"
      attribute: "content"
    title:
      selector: "h1.entry-title"
      extraction: text
      transforms:
        - trim: true
    originalTitle:
      selector: ".original-title"
      extraction: text
    posterUrl:
      selector: ".poster-box img.main-poster"
      attribute: "src"
      fallbacks:
        - selector: "meta[property='og:image']"
          attribute: "content"
    backdropUrl:
      selector: ".backdrop-box img.backdrop"
      attribute: "src"
    description:
      selector: ".synopsis .overview"
      extraction: text
      transforms:
        - trim: true
    rating:
      selector: ".vote-average"
      extraction: text
      transforms:
        - regex: "(\\d+\\.\\d+|\\d+)"
          group: 1
      type: double
    releaseYear:
      selector: ".meta-year"
      extraction: text
      transforms:
        - regex: "(\\d{4})"
          group: 1
      type: int
    genres:
      selector: ".genres a"
      extraction: text_list
    tags:
      selector: ".tags a"
      extraction: text_list
    trailerUrl:
      selector: ".trailer-container iframe"
      attribute: "src"
    directors:
      selector: ".directors-list .director"
      extraction: text_list

  movie:
    duration:
      selector: ".duration"
      extraction: text
      transforms:
        - regex: "(\\d+)"
          group: 1
      type: int

  series:
    status:
      selector: ".series-status"
      extraction: text
    seasonsSelector: ".seasons-container .season-wrapper"
    episodesSelector: ".episodes-list .episode-item"
    seasonNumber:
      selector: ".season-title"
      transforms:
        - regex: "Season (\\d+)"
          group: 1
      type: int
      default: "1"
    episode:
      id:
        selector: "a"
        attribute: "data-id"
      title:
        selector: ".ep-title"
        extraction: text
      episodeNumber:
        selector: ".ep-num"
        type: int
        transforms:
          - regex: "(\\d+)"
            group: 1
      url:
        selector: "a"
        attribute: "href"
      releaseDate:
        selector: ".ep-airdate"
        extraction: text

people:
  itemSelector: ".cast-list .actor-card, .actors-grid .actor-card"
  fields:
    name:
      selector: ".actor-name"
      extraction: text
    character:
      selector: ".character-name"
      extraction: text
    url:
      selector: "a"
      attribute: "href"
    photoUrl:
      selector: "img"
      attribute: "src"
  detail:
    name:
      selector: "h1.person-name"
      extraction: text
    biography:
      selector: ".biography .bio-text, .biography"
      extraction: text
    photoUrl:
      selector: ".headshot img"
      attribute: "src"
    birthDate:
      selector: ".birth-date"
      extraction: text
    knownForSelector: ".known-for .movie-grid .credit-card"
    knownForFields:
      title:
        selector: "h4.title, .title"
        extraction: text
      url:
        selector: "a"
        attribute: "href"
      posterUrl:
        selector: "img"
        attribute: "src"
      releaseYear:
        selector: "span.year"
        extraction: text
        transforms:
          - regex: "(\\d{4})"
            group: 1
        type: int
