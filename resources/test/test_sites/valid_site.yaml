id: test-site
name: Test Site
baseUrl: https://test-site.example.com
version: 1
headers:
  User-Agent: "TestBrowser/1.0"

search:
  urlTemplate: "/search?q={query}&page={page}"
  method: GET
  itemSelector: ".search-card"
  fields:
    id:
      selector: "a.link"
      attribute: "href"
      transforms:
        - regex: "/(movie|tv)/([a-z0-9-]+)"
          group: 2
    title:
      selector: ".title"
      extraction: text
      transforms:
        - trim: true
    url:
      selector: "a.link"
      attribute: "href"
    posterUrl:
      selector: "img.poster"
      attribute: "data-src"
      fallbacks:
        - selector: "img.poster"
          attribute: "src"
    releaseYear:
      selector: ".year"
      extraction: text
      transforms:
        - regex: "(\\d{4})"
          group: 1
      type: int
    rating:
      selector: ".score"
      extraction: text
      type: double

catalogs:
  - id: popular
    name: Popular Titles
    type: MOVIES
    urlTemplate: "/popular?page={page}"
    itemSelector: ".movie-card"
  - id: trending-tv
    name: Trending Series
    type: SERIES
    urlTemplate: "/trending-tv?page={page}"
    itemSelector: ".tv-card"

details:
  typeDetector:
    selector: ".episodes-grid"
    existsAs: TV_SERIES
    default: MOVIE

  movie:
    title:
      selector: "h1.movie-title"
      extraction: text
    description:
      selector: ".plot-summary"
      extraction: text
    posterUrl:
      selector: ".movie-poster img"
      attribute: "src"
    releaseYear:
      selector: ".release-date"
      transforms:
        - regex: "(\\d{4})"
          group: 1
      type: int
    genres:
      selector: ".genres span"
      extraction: text_list

  series:
    episodesSelector: ".episode-row"
    seasonNumber:
      selector: ".season-title"
      transforms:
        - regex: "Season (\\d+)"
          group: 1
      type: int
      default: "1"
    episode:
      id:
        selector: "a"
        attribute: "data-ep-id"
      title:
        selector: ".ep-name"
        extraction: text
      episodeNumber:
        selector: ".ep-number"
        type: int
        transforms:
          - regex: "(\\d+)"
            group: 1
      url:
        selector: "a"
        attribute: "href"

people:
  itemSelector: ".actor-item"
  fields:
    id:
      selector: "a"
      attribute: "href"
    name:
      selector: ".name"
      extraction: text
    photoUrl:
      selector: "img"
      attribute: "src"
    url:
      selector: "a"
      attribute: "href"
  detail:
    name:
      selector: "h1.person-name"
      extraction: text
    biography:
      selector: ".biography-text"
      extraction: text
    photoUrl:
      selector: ".headshot img"
      attribute: "src"
    knownForSelector: ".credits .movie-item"
