name: Build CloudStream Plugins

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK build-tools (for d8 DEX compiler)
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --install "build-tools;35.0.0" "platforms;android-34" --sdk_root=$HOME/android-sdk
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/build-tools/35.0.0" >> $GITHUB_PATH

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Plugins & Manifest
        run: ./gradlew test makePlugin || ./gradlew makePlugin

      - name: Verify classes.dex in cs3 plugins
        run: |
          for plugin in PornTrex MultiSource; do
            if unzip -l build/dist/$plugin.cs3 | grep -q "classes.dex"; then
              echo "✓ classes.dex found in $plugin.cs3"
            else
              echo "✗ ERROR: classes.dex NOT in $plugin.cs3!"
              unzip -l build/dist/$plugin.cs3
              exit 1
            fi
          done

      - name: Deploy to Builds Branch
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: ./build/dist
